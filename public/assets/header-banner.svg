<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="zenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="400" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <rect width="1600" height="400" fill="url(#dotPattern)"/>

  <!-- Minimalist Zen Circle (Enso style subtle rings) -->
  <g transform="translate(1360, 200)" opacity="0.45">
    <circle r="140" fill="none" stroke="url(#zenGlow)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle r="110" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.25"/>
    <circle r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
    <circle r="6" fill="#fbbf24" fill-opacity="0.8"/>
  </g>

  <!-- Left Accent Line -->
  <line x1="80" y1="90" x2="80" y2="310" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Header Content -->
  <g transform="translate(110, 0)">
    <!-- Top Pill / Tag -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="225" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#fbbf24"/>
      <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#e2e8f0" text-transform="uppercase">MONKHOOD COMMUNITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5" fill="#ffffff">
      1-on-1 Mentorship &amp; Breakthrough Session
    </text>

    <!-- Host Subtitle -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      A personalized, high-impact roadmap conversation with <tspan fill="#f8fafc" font-weight="600">Mr. Deepanshu Bagde</tspan>
    </text>

    <!-- Dimension Spec & Google Forms 4:1 Note (Subtle watermark) -->
    <text x="0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#64748b" text-transform="uppercase">
      CONFIDENTIAL QUALIFIER APPLICATION • 1600 × 400 (4:1 RATIO)
    </text>
  </g>
</svg>
